server.port=8080

# Motor de persistencia activo: mysql (por defecto) o h2.
# Cambiar este valor es la UNICA forma soportada de intercambiar el adaptador de
# infraestructura - ni el dominio ni los servicios de aplicacion se tocan.
app.persistencia.motor=mysql

app.db.mysql.url=jdbc:mysql://localhost:3306/inventario?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
app.db.mysql.usuario=inventario
app.db.mysql.password=inventario

# H2 embebido en archivo local (./data/inventario.mv.db) - util para desarrollo o demos
# sin levantar el contenedor MySQL. Activar con app.persistencia.motor=h2.
app.db.h2.url=jdbc:h2:./data/inventario;AUTO_SERVER=TRUE
app.db.h2.usuario=sa
app.db.h2.password=